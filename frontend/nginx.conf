server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # все, что идет на /api, передается в backend по имени (сетевой alias "backend").
    # Адрес резолвится через встроенный DNS Docker (127.0.0.11) в момент запроса,
    # поэтому nginx стартует, даже если backend еще не поднялся.
    location /api {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
}